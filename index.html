<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>GO Lunch</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  padding:20px;
}
.card{
  background:white;
  max-width:400px;
  margin:auto;
  padding:20px;
  border-radius:20px;
}
button{
  width:100%;
  padding:12px;
  background:#00B14F;
  color:white;
  border:none;
  border-radius:10px;
}
</style>
</head>
<body>

<div class="card">
<h1>GO Lunch</h1>
<p>移動時間を、食事の時間に。</p>

<p>出発地</p>
<select>
<option>成蹊大学</option>
<option>吉祥寺駅</option>
<option>三鷹駅</option>
</select>

<p>到着地</p>
<select>
<option>東京駅</option>
<option>新宿駅</option>
<option>渋谷駅</option>
</select>

<p>乗車時間</p>
<input type="time">

<p>お弁当</p>
<select>
<option>生姜焼き弁当</option>
<option>チキン南蛮弁当</option>
<option>サンドイッチセット</option>
</select>

<br><br>

<button>予約する</button>
</div>

</body>
</html>
